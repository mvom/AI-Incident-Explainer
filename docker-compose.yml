# Docker Compose for AI Incident Explainer
version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-explainer-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=your_open_ai_key
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/frontend
    container_name: ai-explainer-frontend
    ports:
      - "3000:3000"
    working_dir: /frontend
    volumes:
      - ./frontend/frontend:/frontend
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    depends_on:
      - backend
